name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v2.0.0); the release is cut from the selected branch"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - uses: ilammy/msvc-dev-cmd@v1

      # Build simulator
      - name: Build simulator
        run: |
          cmake -S simulator -B simulator/build -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_BUILD_TYPE=Release
          cmake --build simulator/build --config Release

      # Smoke test simulator
      - name: Smoke test simulator
        run: |
          simulator\build\lvgl_sim.exe --output-png simulator\build\test.png --output-json simulator\build\test.json
          if (!(Test-Path simulator\build\test.png)) { throw "PNG not generated" }
          Write-Host "Simulator OK"

      # Build MCP server
      - name: Build MCP server
        working-directory: mcp-server
        run: |
          npm ci
          npx tsc

      # Integration test
      - name: Integration test
        working-directory: mcp-server
        run: |
          $init = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0.1"}}}'
          $result = $init | node dist/index.js 2>$null
          if ($result -match '"lvgl-simulator"') {
            Write-Host "MCP server OK"
          } else {
            throw "MCP server did not respond correctly"
          }

      # Package release archive
      - name: Package release
        run: |
          New-Item -ItemType Directory -Force -Path release\simulator
          New-Item -ItemType Directory -Force -Path release\mcp-server

          # Full simulator directory (source + build artifacts for incremental compilation)
          Copy-Item simulator\CMakeLists.txt release\simulator\
          Copy-Item simulator\lv_conf.h release\simulator\
          Copy-Item simulator\main.c release\simulator\
          Copy-Item simulator\hal\ release\simulator\hal\ -Recurse
          Copy-Item simulator\export\ release\simulator\export\ -Recurse
          Copy-Item simulator\templates\ release\simulator\templates\ -Recurse
          Copy-Item simulator\lib\ release\simulator\lib\ -Recurse

          # Build artifacts (prebuilt LVGL lib + exe)
          Copy-Item simulator\build\ release\simulator\build\ -Recurse
          # Remove test outputs from build dir
          Remove-Item release\simulator\build\test.png -ErrorAction SilentlyContinue
          Remove-Item release\simulator\build\test.json -ErrorAction SilentlyContinue
          # Strip machine-specific CMake cache/generator files (breaks reconfigure on user machines)
          Remove-Item release\simulator\build\CMakeCache.txt -ErrorAction SilentlyContinue
          Remove-Item release\simulator\build\CMakeFiles\ -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem release\simulator\build\ -Recurse -Filter '.ninja*' -Force -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem release\simulator\build\ -Recurse -Include 'build.ninja','rules.ninja','.ninja_deps','.ninja_log' -Force -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

          # MCP server (dist + deps)
          Copy-Item mcp-server\dist\ release\mcp-server\dist\ -Recurse
          Copy-Item mcp-server\bin\ release\mcp-server\bin\ -Recurse
          Copy-Item mcp-server\package.json release\mcp-server\
          Copy-Item mcp-server\package-lock.json release\mcp-server\

          # Install production deps only
          Push-Location release\mcp-server
          npm ci --omit=dev --ignore-scripts
          Pop-Location

          # Config example
          @"
          {
            "mcpServers": {
              "lvgl-simulator": {
                "command": "npx",
                "args": ["lvgl-mcp-server"]
              }
            }
          }
          "@ | Out-File -Encoding utf8 release\claude-config-example.json

          # Zip it
          Compress-Archive -Path release\* -DestinationPath lvgl-mcp-esp32-windows-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lvgl-mcp-esp32-windows-x64
          path: lvgl-mcp-esp32-windows-x64.zip

  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # Build simulator
      - name: Build simulator
        run: |
          cmake -S simulator -B simulator/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build simulator/build

      # Smoke test simulator
      - name: Smoke test simulator
        run: |
          ./simulator/build/lvgl_sim --output-png simulator/build/test.png --output-json simulator/build/test.json
          if [ ! -s simulator/build/test.png ]; then echo "PNG not generated"; exit 1; fi
          echo "Simulator OK"

      # Build MCP server
      - name: Build MCP server
        working-directory: mcp-server
        run: |
          npm ci
          npx tsc

      # Integration test
      - name: Integration test
        working-directory: mcp-server
        run: |
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0.1"}}}'
          result=$(echo "$init" | node dist/index.js 2>/dev/null)
          if echo "$result" | grep -q '"lvgl-simulator"'; then
            echo "MCP server OK"
          else
            echo "MCP server did not respond correctly: $result"
            exit 1
          fi

      # Package release archive
      - name: Package release
        run: |
          mkdir -p release/simulator release/mcp-server

          # Full simulator directory (source + build artifacts for incremental compilation)
          cp simulator/CMakeLists.txt release/simulator/
          cp simulator/lv_conf.h release/simulator/
          cp simulator/main.c release/simulator/
          cp -r simulator/hal release/simulator/hal
          cp -r simulator/export release/simulator/export
          cp -r simulator/templates release/simulator/templates
          cp -r simulator/lib release/simulator/lib

          # Build artifacts (prebuilt LVGL lib + binary)
          cp -r simulator/build release/simulator/build
          # Remove test outputs from build dir
          rm -f release/simulator/build/test.png release/simulator/build/test.json
          # Strip machine-specific CMake cache/generator files (breaks reconfigure on user machines)
          rm -f release/simulator/build/CMakeCache.txt
          rm -rf release/simulator/build/CMakeFiles
          find release/simulator/build -name '.ninja*' -type f -delete
          find release/simulator/build -name 'build.ninja' -type f -delete
          find release/simulator/build -name 'rules.ninja' -type f -delete

          # MCP server (dist + deps)
          cp -r mcp-server/dist release/mcp-server/dist
          cp -r mcp-server/bin release/mcp-server/bin
          cp mcp-server/package.json release/mcp-server/
          cp mcp-server/package-lock.json release/mcp-server/

          # Install production deps only
          ( cd release/mcp-server && npm ci --omit=dev --ignore-scripts )

          # Config example
          cat > release/claude-config-example.json <<'JSON'
          {
            "mcpServers": {
              "lvgl-simulator": {
                "command": "npx",
                "args": ["lvgl-mcp-server"]
              }
            }
          }
          JSON

          # Tarball with simulator/ at archive root
          tar -czf lvgl-mcp-esp32-linux-x64.tar.gz -C release .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lvgl-mcp-esp32-linux-x64
          path: lvgl-mcp-esp32-linux-x64.tar.gz

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lvgl-mcp-esp32-*-x64
          merge-multiple: true

      - name: Generate release notes
        id: notes
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          cat <<'NOTES' > release-notes.md
          ## LVGL MCP Server for ESP32

          Headless LVGL simulator with MCP integration for visual UI development feedback.

          ### Install via npm (recommended)

          ```
          npm install -g lvgl-mcp-server
          ```

          Then add to `.claude/settings.json`:
          ```json
          {
            "mcpServers": {
              "lvgl-simulator": {
                "command": "npx",
                "args": ["lvgl-mcp-server"]
              }
            }
          }
          ```

          The simulator binary is downloaded automatically on install.

          ### Manual install (from archive)
          1. Extract the archive (`.zip` on Windows, `.tar.gz` on Linux)
          2. `cd mcp-server && npm ci --omit=dev`
          3. Add to Claude Code config with full paths to `mcp-server/dist/index.js`

          ### What's included
          - `simulator/` — Full LVGL 9.5 headless renderer (source + prebuilt binary)
            - Windows x64 (MSVC) in the `.zip`
            - Linux x64 (GCC) in the `.tar.gz`
          - `mcp-server/` — Node.js MCP server (stdio transport)

          ### Requirements

          **Windows**
          - Windows 10/11 x64
          - Node.js 18+
          - Visual Studio Build Tools 2019+ (for incremental compilation)

          **Linux**
          - Linux x64
          - Node.js 18+
          - gcc or clang, cmake ≥ 3.16, and ninja or make (for incremental compilation)
          NOTES

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            lvgl-mcp-esp32-windows-x64.zip
            lvgl-mcp-esp32-linux-x64.tar.gz
          draft: false
          prerelease: false

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build MCP server
        working-directory: mcp-server
        run: |
          npm ci
          npx tsc

      - name: Publish to npm
        working-directory: mcp-server
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
