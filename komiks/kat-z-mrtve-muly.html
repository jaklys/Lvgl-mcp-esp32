<title>Kat z Mrtvé Muly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Courier+Prime:wght@400;700&family=Patrick+Hand&family=Rye&display=swap">
<style>
/* Layout: komiksový sešit z laciného papíru na tmavé kůži; panely ve dvou sloupcích, široké přes celou šíři */
:root{
  --leather:#21170f;
  --leather-2:#2e2117;
  --paper:#efe1c0;
  --ink:#1b1410;
  --blood:#b3201c;
  --mustard:#f0cf6a;
  --bone:#fffaf0;
  --dust:#c9b48e;
  --f-title:'Rye', Georgia, 'Times New Roman', serif;
  --f-sfx:'Bangers', Impact, 'Arial Black', sans-serif;
  --f-talk:'Patrick Hand', 'Comic Sans MS', 'Trebuchet MS', sans-serif;
  --f-cap:'Courier Prime', 'Courier New', monospace;
  color-scheme:dark;
}
body{
  background:var(--leather);
  background-image:radial-gradient(ellipse at 50% 0%, var(--leather-2), var(--leather) 70%);
  color:var(--paper);
  font-family:var(--f-cap);
}
.wrap{
  max-width:1100px;margin:0 auto;
  padding-block:28px 72px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid;gap:28px;
}
.cover{display:grid;gap:14px;text-align:center}
.cover .kicker{font-family:var(--f-cap);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--dust)}
.cover h1{
  font-family:var(--f-title);font-weight:400;margin:0;
  font-size:clamp(40px, 9vw, 96px);line-height:.95;color:var(--mustard);
  text-shadow:4px 4px 0 var(--blood), 7px 7px 0 var(--ink);
  text-wrap:balance;
}
.cover .tag{font-family:var(--f-talk);font-size:clamp(17px, 2.4vw, 22px);color:var(--paper);margin:0}
.book{
  display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:14px;
  background:var(--paper);padding:16px;
  box-shadow:0 0 0 1px #00000055, 0 18px 40px #00000088;
}
.panel{position:relative;margin:0;border:3px solid var(--ink);background:var(--bone);display:flex;flex-direction:column;min-width:0}
.panel.wide{grid-column:1 / -1}
.cap{
  background:var(--mustard);color:var(--ink);
  font-family:var(--f-cap);font-weight:700;font-size:clamp(12px, 1.45vw, 14.5px);line-height:1.3;
  padding:6px 10px;border-bottom:3px solid var(--ink);
}
.cap.bottom{order:2;border-bottom:0;border-top:3px solid var(--ink)}
.art{position:relative;container-type:inline-size;aspect-ratio:4 / 3;overflow:hidden;max-width:100%}
.wide .art{aspect-ratio:8 / 3}
.art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.b{
  position:absolute;z-index:2;
  background:var(--bone);color:var(--ink);
  border:2px solid var(--ink);border-radius:1.1em;
  padding:.32em .62em;
  font-family:var(--f-talk);font-size:clamp(11px, 4.3cqw, 20px);line-height:1.12;text-align:center;
}
.wide .b{font-size:clamp(11px, 2.25cqw, 20px)}
.b.shout{font-family:var(--f-sfx);letter-spacing:.04em;border-width:3px;font-size:clamp(13px, 5.2cqw, 26px)}
.wide .b.shout{font-size:clamp(13px, 2.8cqw, 26px)}
.b::before,.b::after{content:"";position:absolute;border-style:solid;width:0;height:0}
.b::before{bottom:-13px;left:18%;border-width:13px 9px 0 0;border-color:var(--ink) transparent transparent transparent}
.b::after{bottom:-9px;left:calc(18% + 2px);border-width:9px 6px 0 0;border-color:var(--bone) transparent transparent transparent}
.b.tr::before{left:auto;right:18%;border-width:13px 0 0 9px}
.b.tr::after{left:auto;right:calc(18% + 2px);border-width:9px 0 0 6px}
.b.none::before,.b.none::after{display:none}
.sfx{
  position:absolute;z-index:3;pointer-events:none;line-height:1;white-space:nowrap;
  font-family:var(--f-sfx);color:var(--mustard);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;
  text-shadow:3px 3px 0 var(--blood);
}
.tag-name{
  position:absolute;bottom:4%;transform:translateX(-50%);z-index:2;
  background:var(--ink);color:var(--mustard);padding:.25em .55em;text-align:center;
  font-family:var(--f-title);font-size:clamp(10px, 2cqw, 17px);line-height:1.1;white-space:nowrap;
}
.tag-name small{display:block;font-family:var(--f-cap);color:var(--paper);font-size:.72em;letter-spacing:.06em}
.chapter{
  grid-column:1 / -1;margin:10px 0 0;color:var(--ink);
  display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;
  border-bottom:4px double var(--ink);padding-bottom:6px;
}
.chapter span{font-family:var(--f-cap);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--blood)}
.chapter b{font-family:var(--f-title);font-weight:400;font-size:clamp(22px, 3.4vw, 34px);line-height:1.05;text-wrap:balance}
.chapter:first-child{margin-top:0}
.news{background:#ece4cf;color:var(--ink);padding:16px 18px 18px;display:grid;gap:8px;flex:1;align-content:start}
.news .mast{font-family:var(--f-title);font-size:clamp(24px, 3.6vw, 38px);text-align:center;border-bottom:3px double var(--ink);padding-bottom:4px;letter-spacing:.04em}
.news .date{font-size:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:4px}
.news h3{font-family:var(--f-title);font-weight:400;font-size:clamp(20px, 3vw, 30px);line-height:1.05;margin:4px 0 0;text-align:center;text-wrap:balance}
.news p{margin:0;font-size:13px;line-height:1.45;columns:2 160px;column-gap:16px}
.end{text-align:center;display:grid;gap:10px;justify-items:center}
.end .konec{font-family:var(--f-title);font-size:clamp(48px, 10vw, 110px);color:var(--blood);text-shadow:4px 4px 0 var(--ink);line-height:1}
.end p{font-family:var(--f-talk);font-size:clamp(17px, 2.3vw, 21px);max-width:60ch;margin:0;color:var(--paper)}
.end .rating{font-family:var(--f-cap);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dust)}
@media (max-width:640px){
  .book{grid-template-columns:minmax(0, 1fr);padding:8px;gap:10px}
  .wide .art{aspect-ratio:2 / 1}
  .wide .b{font-size:clamp(10px, 3.1cqw, 17px)}
  .wide .b.shout{font-size:clamp(12px, 3.8cqw, 22px)}
  .tag-name{font-size:clamp(8px, 2.6cqw, 14px)}
}
</style>

<div class="wrap">
  <header class="cover">
    <div class="kicker">Arizona · 1872 · pět nocí · jen pro dospělé</div>
    <h1>Kat z Mrtvé Muly</h1>
    <p class="tag">Weird western o pěti hrdinech, kteří si to nezasloužili.</p>
  </header>
  <main class="book" id="book"></main>
  <footer class="end">
    <div class="konec">KONEC</div>
    <p>Trapný a tragický konec. Zvítězili omylem, za cenu jednoho života, a slávu i stříbro shrábli jiní.</p>
    <div class="rating">Rabín · Kopr · Krysa · Beznohá · Mlíčňák</div>
  </footer>
</div>

<script>
(function(){
const C={ink:'#1b1410',bone:'#efe6d2',blood:'#b3201c',wood:'#8a5a32',crowd:'#6b4a33',gold:'#e8b93c',green:'#4f7a3f',skin:'#9b958a',mesq:'#a65a2a'};

let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};

/* ---------- body parts ---------- */
const POSE={down:[[4,14],[6,28]],out:[[15,1],[30,1]],up:[[10,-13],[13,-28]],point:[[14,-3],[30,-9]],hip:[[11,10],[3,19]],reach:[[16,5],[34,9]],gun:[[15,0],[30,-1]]};
function arm(x,y,pose,side,c,w=5.5){
  const p=POSE[pose]||POSE.down;

  if(pose==='gun') s+=P(`M${h[0]},${h[1]-2} h${side*12} v3.5 h${-side*8} v5 h${-side*4}z`,c);

}
function hat(t,c){
  switch(t){
    case 'cowboy':return E(0,-93,15,3.2,c)+P('M-8,-93 Q-9,-107 0,-104 Q9,-107 8,-93Z',c);
    case 'flat':return E(0,-93,17,2.6,c)+R(-8,-101,16,8,c);
    case 'top':return E(0,-93,12,2.6,c)+R(-7,-114,14,21,c);

}
function man(o={}){
  const c=o.c||C.ink;let s='';

  s+=R(-3,-82,6,6,c)+Ci(0,-86,8,c);

  if(o.blink) s+=L(-5,-87,-1,-87,'#fff',1.3)+L(1,-87,5,-87,'#fff',1.3);
  if(o.xeye) s+=L(-5,-89,-1,-85,C.blood,1.4)+L(-5,-85,-1,-89,C.blood,1.4)+Ci(3,-87,1.9,'#fff');

}

/* ---------- cast ---------- */
const flame=(o={})=>man({hat:o.nohat?null:'cowboy',coat:true,...o})+(o.tears?P('M5,-86 q2,4 0,6 q-2,-2 0,-6z','#9fd3ff')+P('M-4,-84 q2,4 0,6 q-2,-2 0,-6z','#9fd3ff'):'');
function zabak(o={}){
  const c=C.ink;let s='';
  s+=L(-7,-24,-8,-3,c,8)+L(7,-24,8,-3,c,8)+P('M-14,-4 h10 v4 h-11z',c)+P('M4,-4 h10 l1,4 h-11z',c);
  s+=E(0,-40,19,22,c);
  s+=arm(-14,-54,o.armL||'down',-1,c,6)+arm(14,-54,o.armR||'down',1,c,6);
  s+=Ci(0,-68,10,c)+E(-3,-73,4,2,'rgba(255,255,255,.5)');
  if(o.sweat!==false) s+=P('M13,-76 q2,4 0,6 q-2,-2 0,-6z','#8fd0ff')+P('M-15,-72 q2,4 0,6 q-2,-2 0,-6z','#8fd0ff');
  if(o.kufrik) s+=R(17,-28,20,14,C.wood,'rx="2"')+P('M23,-28 v-3 h8 v3 h-2 v-1.5 h-4 v1.5z',c);
  if(o.kasa) s+=R(-16,-52,32,18,'#5a3a1e','rx="2"')+R(-4,-46,8,5,C.gold);
  if(o.whistle) s+=R(7,-69,16,4.5,C.bone,'rx="2"');
  return s;
}
function lucine(o={}){
  const c=C.ink;let s='';
  if(o.torn){
    s+=P('M-7,-58 L7,-58 Q14,-30 22,-2 L4,-2 L3,-28 L-2,-28 L-4,-2 L-11,-2 Q-9,-30 -7,-58Z',c);
    s+=P('M-3,-30 L3,-30 L4,-8 L-11,-8 L-9,-28Z',C.bone)+R(-7,-22,4,4,'#c9a36a')+R(-2,-14,4,3,'#7a8fa8');
  } else s+=P('M-7,-58 L7,-58 Q13,-30 23,-2 L-23,-2 Q-13,-30 -7,-58Z',c)+E(-15,-44,8,11,c);
  s+=P('M-8,-78 Q0,-81 8,-78 L6,-56 L-6,-56Z',c);
  s+=arm(-8,-75,o.armL||'down',-1,c,4.5)+arm(8,-75,o.armR||'down',1,c,4.5);
  s+=R(-2.5,-82,5,5,c)+Ci(0,-86,7.5,c)+Ci(-5,-93,5,c)+P('M-4,-95 Q-10,-112 -19,-118 Q-12,-105 -7,-94Z',C.blood);
  return s;
}
function iveta(o={}){
  const c=C.ink;let s='';
  s+=L(-4,-46,-5,-3,c,6)+P('M-10,-4 h8 v4 h-9z',c);
  if(o.leg==='none') s+=L(4,-46,6,-30,c,6);
  else s+=L(4,-46,5,-30,c,6)+L(5,-30,5,-1,o.leg==='mesquite'?C.mesq:C.wood,3.4);
  s+=P('M-9,-78 Q0,-81 9,-78 L7,-44 L-7,-44Z',c);
  s+=arm(-9,-75,o.armL||'down',-1,c,4.5)+arm(9,-75,o.armR||'down',1,c,4.5);
  s+=P('M-6,-92 Q-15,-80 -12,-58 L-6,-62 Q-8,-80 -1,-90Z',c);
  s+=R(-2.5,-82,5,5,c)+Ci(0,-87,7,c);
  if(o.glow) s+=Ci(0,-88,9,'#ffe066','opacity=".25"')+Ci(-2.6,-88,1.8,'#ffe066')+Ci(2.6,-88,1.8,'#ffe066');
  if(o.bite) s+=Ci(3,-79,2.6,C.blood)+P('M3,-78 q1,6 0,10 q-1,-4 0,-10z',C.blood);
  if(o.rifle) s+=L(-18,-64,34,-92,c,3.2)+L(-18,-64,-8,-70,C.wood,5);
  return s;
}
function robertus(o={}){
  const c=C.ink;let s='';
  s+=L(-2,-12,26,-4,c,7)+L(2,-10,28,-2,c,7)+P('M24,-9 h6 v9 h-6z',c);
  s+=P('M-10,-46 Q0,-50 10,-44 L6,-10 L-10,-10Z',c);
  s+=Ci(8,-50,8,c)+E(10,-55,14,3,c)+P('M3,-55 Q2,-66 10,-64 Q18,-66 17,-55Z',c);
  s+=arm(4,-40,'reach',1,c,5);
  if(o.bottle!==false) s+=R(35,-40,6,14,C.green,'rx="2"')+R(36.5,-45,3,6,C.green);
  if(o.milk) s+=E(13,-46,5,1.4,'#fff');
  if(o.zzz) s+=T(22,-62,'z',10)+T(30,-72,'Z',13)+T(40,-85,'Z',16);
  return s;
}
const robertusStand=(o={})=>man({hat:'cowboy',armL:o.armL||'down',armR:o.armR||'down'})+(o.knives?L(40,-73,53,-79,C.bone,2.2)+L(-40,-73,-53,-79,C.bone,2.2):'')+(o.milk?E(1,-82,5,1.3,'#fff'):'');
function thorne(o={}){
  let s=man({hat:'top',coat:true,armL:o.armL||'up',armR:o.armR||'up'});
  if(o.robe) s+=P('M-12,-77 Q0,-80 12,-77 L21,-2 L-21,-2Z','#ddd5c4');
  s+= o.half ? P('M-7,-84 Q0,-79 7,-84 L6,-73 L3,-69 L1,-74 L-1,-67 L-3,-73 L-6,-70Z','#b9b2a5')
             : P('M-7,-84 Q0,-79 7,-84 L5,-58 Q2,-44 0,-36 Q-2,-44 -5,-58Z','#b9b2a5');
  s+=Ci(-3,-88,1.1,C.bone)+Ci(3,-88,1.1,C.bone);
  return s;
}
const abner=(o={})=>man({hat:'flat',coat:true,eyes:!o.blink&&!o.xeye,...o});
const danite=(o={})=>man({hat:'flat',coat:true,...o});
const morty=(o={})=>man({hat:'top',armR:'out',armL:o.armL||'down'})+(o.tape!==false?L(40,-73,95,-58,C.gold,2.2,'stroke-dasharray="4 2"'):'')+R(-24,-50,5,12,C.green,'rx="1.5"');
function ines(o={}){
  let s=man({hat:'sombrero',armL:o.armL||'hip',armR:o.armR||'down'});
  s+=P('M-13,-78 L13,-78 L19,-50 L-19,-50Z',C.blood)+L(-16,-58,16,-58,C.gold,2)+L(-17,-53,17,-53,C.gold,1.4);
  s+=L(-3,-91,3,-82,'#d7b49a',1.3);
  if(o.machete) s+=P('M23,-102 L31,-132 L35,-130 L26,-100Z','#d9dde3');
  if(o.smoke) s+=Ci(10,-84,1.4,'#ff8a3d')+`<path d="M11,-86 q4,-6 0,-12 q-4,-6 1,-12" fill="none" stroke="#cfc6b8" stroke-width="1" opacity=".7"/>`;
  return s;
}
function hannah(o={}){
  const c='#5f5a55';let s='';
  s+=P('M-7,-58 L7,-58 Q11,-30 18,-2 L-18,-2 Q-11,-30 -7,-58Z',c)+P('M-8,-78 Q0,-81 8,-78 L6,-56 L-6,-56Z',c);
  s+=arm(-8,-75,o.armL||'down',-1,c,4.5)+arm(8,-75,o.armR||'down',1,c,4.5);
  s+=R(-5,-79,10,3,C.bone)+R(-2.5,-82,5,5,C.ink)+Ci(0,-86,7.5,C.ink);
  s+=P('M-10,-84 Q-10,-98 0,-98 Q11,-98 10,-84 L7,-84 Q7,-93 0,-93 Q-7,-93 -7,-84Z',C.bone);
  if(o.wrists) s+=Ci(-13,-48,2,C.blood)+Ci(13,-48,2,C.blood);
  return s;
}
function rachel(o={}){
  const sk=C.skin;let s='';
  if(o.burn) s+=Ci(0,-50,60,'#dfe8ff','opacity=".35"')+Ci(0,-50,38,'#f4f8ff','opacity=".5"');
  s+=L(-4,-30,-6,-2,sk,3)+L(4,-30,6,-2,sk,3);
  s+=P('M-8,-74 L8,-74 L14,-22 L10,-28 L6,-18 L2,-27 L-2,-16 L-6,-27 L-10,-19 L-14,-24Z','#3b3531');
  for(let i=0;i<4;i++) s+=L(-5,-70+i*4,5,-70+i*4,sk,1.2);
  s+=`<polyline points="-7,-72 -22,-62 -38,-58" fill="none" stroke="${sk}" stroke-width="3" stroke-linecap="round"/>`;
  s+=`<polyline points="7,-72 22,-64 40,-60" fill="none" stroke="${sk}" stroke-width="3" stroke-linecap="round"/>`;
  s+=L(40,-60,47,-64,'#fff',1)+L(40,-60,48,-59,'#fff',1)+L(40,-60,46,-55,'#fff',1);
  s+=L(-38,-58,-45,-62,'#fff',1)+L(-38,-58,-46,-57,'#fff',1)+L(-38,-58,-44,-53,'#fff',1);
  s+=Ci(0,-84,8.5,sk);
  s+=P('M-10,-82 Q-11,-97 0,-97 Q11,-97 10,-82 L7,-84 Q6,-92 0,-92 Q-6,-92 -7,-84Z',C.bone)+P('M-10,-82 L-13,-73 L-8,-78Z',C.bone);
  s+=Ci(-3.2,-86,4,C.blood,'opacity=".4"')+Ci(3.2,-86,4,C.blood,'opacity=".4"')+Ci(-3.2,-86,1.8,'#ff3b30')+Ci(3.2,-86,1.8,'#ff3b30');
  s+=E(0,-79,5.5,3,C.ink)+P('M-5,-80 L5,-80 L4,-77 L3,-79.5 L2,-75.5 L1,-79.5 L0,-75.5 L-1,-79.5 L-2,-75.5 L-3,-79.5 L-4,-77Z','#fff');
  if(o.burn) for(let i=0;i<7;i++){const a=i*0.9;s+=L(0,-50,Math.cos(a)*70,-50+Math.sin(a)*70,'#ffffff',1.4,'opacity=".8"');}
  return s;
}
const bigSal=(o={})=>man({bald:true,apron:true,armL:'out',armR:'out'})+(o.gun?L(-8,-72,66,-75,C.ink,4.5)+R(-14,-77,16,7,C.wood):'');
const pianist=()=>man({hat:'top',armL:'reach',armR:'reach'});

/* ---------- props ---------- */
function crowd(x0,y,n,s,gap,o={}){
  let out='';const hats=['cowboy','flat','cowboy','top','cowboy'];

const host=document.getElementById('book');
let html='';
book.forEach((p,i)=>{
  if(p.chapter){html+=`<h2 class="chapter"><span>${p.chapter[0]}</span><b>${p.chapter[1]}</b></h2>`;return;}
  if(p.news){
    html+=`<figure class="panel"><div class="news"><div class="mast">PRESCOTT MINER</div><div class="date"><span>Prescott, Arizona</span><span>Léta Páně 1872</span><span>Cena 5 centů</span></div><h3>Statečný šerif zachránil Mrtvou Mulu!</h3><p>Šerif Hollis, který se z cest vrátil dva dny po krveprolití v jeskyních pod Novým Siónem, se dal vyfotografovat s mrtvolou šíleného proroka Thornea. Odměnu 500 dolarů vypsanou státem Missouri převzal osobně. O pěti cizincích, kteří byli v jeskyních také, se šerif nezmínil. Jeden z nich prý kulhá, druhý smrdí koprem a třetí pije mléko.</p></div><figcaption class="cap bottom">${p.cap}</figcaption></figure>`;
    return;
  }
  const w=p.wide?800:400,h=300;
  const svg=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${p.alt||''}">${bg(p.bg,w,h,i)}${p.draw()}${R(0,0,w,h,`url(#h${i})`)}</svg>`;
  const balloons=(p.b||[]).map(b=>`<div class="b ${b.tail}${b.shout?' shout':''}" style="left:${b.x}%;top:${b.y}%;width:${b.w}%">${b.t}</div>`).join('');
  const sfx=(p.sfx||[]).map(s=>`<div class="sfx" style="left:${s.x}%;top:${s.y}%;font-size:${s.size}cqw;transform:rotate(${s.r}deg)">${s.t}</div>`).join('');
  const tags=(p.tags||[]).map(t=>`<div class="tag-name" style="left:${t[0]}%">${t[1]}<small>„${t[2]}“</small></div>`).join('');
  html+=`<figure class="panel${p.wide?' wide':''}">${p.cap?`<figcaption class="cap">${p.cap}</figcaption>`:''}<div class="art">${svg}${balloons}${sfx}${tags}</div></figure>`;
});
host.innerHTML=html;
})();
</script>
